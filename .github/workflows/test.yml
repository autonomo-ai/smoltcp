on:
  pull_request:
  merge_group:

name: Test

jobs:
  tests:
    runs-on: [self-hosted, linux, generalist]
    needs:
      [check-msrv, test-msrv, test-stable, clippy, check-unused, test-netsim]
    steps:
      - name: Done
        run: exit 0

  check-msrv:
    runs-on: [self-hosted, linux, generalist]
    steps:
      - uses: actions/checkout@v4
      - name: Run Checks MSRV
        run: ./ci.sh check msrv

  test-msrv:
    runs-on: [self-hosted, linux, generalist]
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests MSRV
        run: ./ci.sh test msrv

  clippy:
    runs-on: [self-hosted, linux, generalist]
    steps:
      - uses: actions/checkout@v4
      - name: Run Clippy
        run: ./ci.sh clippy

  check-unused:
    runs-on: [self-hosted, linux, generalist]
    steps:
      - uses: actions/checkout@v4
      - name: Check for unused code
        run: ./ci.sh check_unused

  test-stable:
    runs-on: [self-hosted, linux, generalist]
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests stable
        run: ./ci.sh test stable

  test-nightly:
    runs-on: [self-hosted, linux, generalist]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests nightly
        run: ./ci.sh test nightly

  test-netsim:
    runs-on: [self-hosted, linux, generalist]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run network-simulation tests
        run: ./ci.sh netsim

  test-build-16bit:
    runs-on: [self-hosted, linux, generalist]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build for target with 16 bit pointer
        run: ./ci.sh build_16bit
